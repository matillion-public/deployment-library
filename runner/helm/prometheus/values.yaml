# Global module control flags (TAKES PRECEDENCE over individual component flags)
# These flags provide centralized control over all components
modules:
  prometheus:
    enabled: true  # Deploy Prometheus server
  adapter:
    enabled: true  # Deploy Prometheus adapter
  api:
    enabled: true  # Deploy custom metrics API

# External Prometheus configuration (when modules.prometheus.enabled=false)
externalPrometheus:
  enabled: false
  url: "http://prometheus.monitoring.svc.cluster.local:9090"  # External Prometheus URL
  namespace: "monitoring"  # Namespace where external Prometheus is running
  serviceName: "prometheus"  # Service name of external Prometheus
  # Network policy configuration for external Prometheus access
  networkPolicy:
    # Method to target external namespace: "label" or "name"
    targetMethod: "label"
    # Label selector for external namespace (when targetMethod: "label")
    namespaceLabels:
      name: "monitoring"
    # Alternative: Use namespace name directly (when targetMethod: "name")
    namespaceName: "monitoring"

adapter:
  enabled: true  # LEGACY: Individual control (DEPRECATED - use modules.adapter.enabled instead)
  podSecurityContext:
    fsGroup: 65534
  ports:
    - port: 443
      targetPort: 8443
  prometheusAdapter:
    args:
      - --config=/etc/adapter/config.yaml
      # prometheus-url is auto-generated from the release name and namespace
      # Override via externalPrometheus.url when using an external Prometheus
      - --secure-port=8443
      - --cert-dir=/tmp
      - --v=10
      - --metrics-relist-interval=1m
    image:
      repository: registry.k8s.io/prometheus-adapter/prometheus-adapter
      tag: v0.12.0
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi
  replicas: 1
  serviceAccount:
    annotations: {}
  type: ClusterIP
adapterConfig:
  configYaml: |-
    rules:
      - seriesQuery: 'app_active_task_count{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "app_.*"
          as: "app_active_task_count"
        metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])'
      - seriesQuery: 'app_active_request_count{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "app_.*"
          as: "app_active_request_count"
        metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])'
      # OpenTelemetry equivalents, served alongside the app_* rules so
      # each runner release picks its source with hpa.metricSource. The
      # exporter adds a `_unit` suffix (the gauges are declared with unit
      # "unit"); the adapter serves them without it.
      - seriesQuery: 'matillion_agent_task_running_unit{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^matillion_agent_task_running_unit$"
          as: "matillion_agent_task_running"
        metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])'
      - seriesQuery: 'matillion_agent_request_active_unit{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^matillion_agent_request_active_unit$"
          as: "matillion_agent_request_active"
        metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])'
api:
  enabled: true  # LEGACY: Individual control (DEPRECATED - use modules.api.enabled instead)
  ports:
    - port: 443
      targetPort: 8443
  type: ClusterIP
config:
  # Namespaces the runner scrape job discovers pods in.
  #
  # One Prometheus can serve every business unit on a shared cluster: the
  # adapter maps app_active_task_count to both `pod` and `namespace`, and the
  # runner HPAs are `type: Pods`, so each Deployment scales on its own pods with
  # no cross-talk between tenants. What is required is that Prometheus can see
  # them — a runner in a namespace missing from this list is never scraped, and
  # its HPA then sits at minReplicas with no error anywhere to explain why.
  #
  # An empty list means every namespace: the pod-list RBAC is already a
  # ClusterRole, so this needs no further permissions. Prefer an explicit list
  # where the set of tenants is known.
  scrapeNamespaces:
    - matillion
  # Regex matched against the pod's `app` label. Each runner release labels its
  # pods `<release>-matillion-runner-pods`, so a shared Prometheus generally
  # wants a pattern such as `.*matillion-runner-pods` rather than the single
  # literal name a one-tenant cluster can get away with.
  scrapePodLabelRegex: matillion-runner-pods
  # Full escape hatch: set this to a complete prometheus.yml and it is used
  # verbatim, ignoring scrapeNamespaces and scrapePodLabelRegex above. Left
  # empty the config is composed from those two settings instead. Anything
  # already overriding this key keeps working exactly as before.
  prometheusYml: ""
  # The two runner metrics endpoints, scraped as separate jobs while customers
  # migrate (DPC-58189). They must match the runner chart's metrics.* values.
  # Neither applies when prometheusYml is set.
  #
  # legacy - Micrometer /actuator/prometheus, app_* names. Deprecated; kept
  #          until product sets the cutover date. Job name `matillion-runner`,
  #          unchanged, so existing dashboards and alerts keep matching.
  legacy:
    enabled: true
    port: 8080
    path: /actuator/prometheus
  # otel - the OpenTelemetry exporter, matillion_agent_* names plus JVM and
  #        process metrics. Job name `matillion-runner-otel`. Against a runner
  #        image without the exporter this target simply reports down.
  otel:
    enabled: true
    port: 9464
    path: /metrics
    # Don't store target_info. It carries the full JVM command line, which can
    # include credentials passed as system properties.
    dropTargetInfo: true
    # Optional regex of metric names to keep from this job; empty keeps all.
    # The endpoint is unfiltered (about 200 series per pod against about 11 on
    # legacy), so a Prometheus that only serves the HPA can narrow it, e.g.
    # "matillion_agent_.*".
    keepMetricsRegex: ""

# Egress NetworkPolicy for the Prometheus pod.
#
# This and config.scrapeNamespaces have to agree. They are separate settings
# because they are enforced by different things: scrapeNamespaces controls what
# service discovery *finds*, this controls what the pod is permitted to
# *reach*. Discovering a target the policy blocks yields an empty metric rather
# than an error, so the mismatch shows up only as an HPA that quietly stops
# scaling.
networkPolicy:
  # Namespaces beyond Prometheus's own that it may scrape into. Empty by
  # default, leaving the rendered policy unchanged. The existing rule uses a
  # bare podSelector, which matches only the release's own namespace — so a
  # shared Prometheus needs every other tenant's runner namespace listed here.
  additionalScrapeNamespaces: []
  # Pod selector applied within those namespaces. Service discovery filters on
  # the config.scrapePodLabelRegex pattern, but NetworkPolicy selectors cannot
  # express a regex. Where tenants use differing release names, set this to
  # `null` to admit any pod in the listed namespaces and let service discovery
  # do the filtering.
  #
  # `null`, not `{}` — Helm coalesces maps, so an empty map leaves this default
  # in place rather than clearing it.
  runnerPodSelector:
    app: matillion-runner-pods
kubernetesClusterDomain: cluster.local
prometheus:
  enabled: true  # LEGACY: Individual control (DEPRECATED - use modules.prometheus.enabled instead)
  ports:
    - port: 9090
      protocol: TCP
      targetPort: 9090
  prometheus:
    args:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus/
    image:
      repository: prom/prometheus
      tag: v2.22.0
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 256Mi
  replicas: 1
  serviceAccount:
    annotations: {}
  type: ClusterIP

# Node selector configuration
# Optional: specify node labels to schedule the prometheus and adapter pods on specific nodes
# Example:
#   nodeSelector:
#     kubernetes.io/os: linux
#     node.kubernetes.io/instance-type: m5.large
nodeSelector: {}
