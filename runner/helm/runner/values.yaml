---
# Optional: Override image tags. These take precedence over nested values.
# Useful for CI/CD pipelines: helm upgrade --set applicationImageTag=v1.2.3
applicationImageTag: ""

# Agent t-shirt size. Drives dpcAgent.dpcAgent.resources via the runnerSizes map below.
# Override on the CLI: helm upgrade --set runnerSize=medium
# small  = 1 vCPU req / 4 GiB,  2 vCPU limit / 4 GiB   (current/legacy default)
# medium = 2 vCPU req / 8 GiB,  4 vCPU limit / 8 GiB
# large  = 4 vCPU req / 16 GiB, 8 vCPU limit / 16 GiB
# xlarge = 8 vCPU req / 32 GiB, 16 vCPU limit / 32 GiB
# Each size requires a node large enough to schedule the requests; see runner/helm/README.md
# for recommended node SKUs per cloud.
runnerSize: small

runnerSizes:
  small:
    requests: { cpu: "1", memory: "4Gi" }
    limits: { cpu: "2", memory: "4Gi" }
  medium:
    requests: { cpu: "2", memory: "8Gi" }
    limits: { cpu: "4", memory: "8Gi" }
  large:
    requests: { cpu: "4", memory: "16Gi" }
    limits: { cpu: "8", memory: "16Gi" }
  xlarge:
    requests: { cpu: "8", memory: "32Gi" }
    limits: { cpu: "16", memory: "32Gi" }

cloudProvider: "<CloudProvider>"
config:
  oauthClientId: "<AgentClientId>"
  oauthClientSecret: "<AgentClientSecret>"
serviceAccount:
  # SA name must match the IRSA / workload-identity trust binding in Terraform.
  # The AWS trust policy hard-codes matillion-runner-sa; changing this requires
  # a matching Terraform update.
  name: matillion-runner-sa
  # Set false to bind the pods to a service account that already exists — one
  # managed by the platform layer rather than by this chart (DuploCloud and
  # similar create their own per-tenant accounts). The chart then renders no
  # ServiceAccount object and no annotations, so whatever identity that account
  # already carries is what the pods get; `name` above must match it.
  create: true
  # Where the pods get their AWS credentials. AWS only — Azure and GCP are
  # selected by azure.workloadIdentity.enabled / gcp.workloadIdentity.enabled.
  #
  #   irsa    annotate the SA with eks.amazonaws.com/role-arn. What every
  #           existing release does; requires roleArn below.
  #   node    no annotation and no injected credentials, so the AWS SDK falls
  #           through to IMDS and picks up the EC2 node instance profile. For
  #           clusters that assign AWS permissions per node rather than per
  #           service account.
  #   static  long-lived access keys from aws.local.* (see below). Least
  #           preferred — a node instance profile beats static keys.
  #
  # `node` has to be selected explicitly; blanking roleArn does NOT get you
  # there. While the annotation is present the EKS pod identity webhook injects
  # AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE, and the web-identity provider
  # sits ahead of IMDS in the credential chain — so an annotation naming a role
  # the pod cannot assume fails outright instead of falling back to the node.
  #
  # Left empty this resolves to irsa, or to static if aws.local.enabled is true.
  # Empty rather than "irsa" on purpose: it has to stay possible to tell "the
  # caller said nothing" from "the caller asked for irsa", because a release that
  # sets aws.local.enabled and never heard of this key must keep working, while
  # asking for irsa AND static together is a contradiction worth rejecting.
  credentialSource: ""
  # Required when credentialSource is irsa. Ignored otherwise.
  roleArn: "<ServiceAccountRoleArn>"
dpcAgent:
  dpcAgent:
    env:
      accountId: <MatillionAccountId>
      agentId: <MatillionAgentId>
      matillionRegion: <MatillionRegion>
      # Proxy + library/cert/driver locations default to empty. The Spring
      # config + the runner's startup script treat empty values as "not set"
      # — leaving the previous "<ProxyHttp>" / "<ExtensionLibraryLocation>"
      # placeholder strings as defaults would land them in the container
      # verbatim, where the runner's Spring proxy parser then crashes on
      # "expected system property https.proxyPort to be a number but got
      # empty string" and the library/cert hydration loops on
      # "Invalid bucket name <ExtensionLibraryLocation>". Customers who
      # actually use a proxy / external libraries override these per-env.
      proxyHttp: ""
      proxyHttps: ""
      proxyExclude: ""
      # proxyProtocolHttp: ""
      # proxyProtocolHttps: ""
      customCertLocation: ""
      extensionLibraryLocation: ""
      externalDriverLocation: ""
      exportLogs: "true"
      # defaultKeyvault: <KeyVaultName>   # Optional: only required for Azure
      # defaultGcpProject: <GcpProjectId> # Optional: only required for GCP
      # matillionEnv: ""                  # Optional: set to "dev" for non-production environments
    image:
      repository: <AgentImageRepository>
      tag: <AgentImageTag>
      # digest: <AgentImageDigest>  # Optional: use digest instead of tag for immutable deployments
    # CKV_K8S_15: `Always` is the secure default — kubelet re-validates the
    # image with the registry on every pod start, so a replaced upstream image
    # (security update, revoked pull perms, etc.) is caught at pod schedule
    # time rather than indefinitely cached on a node. Override per-env (e.g.
    # `Never` for offline / `minikube image load` flows) only when needed.
    imagePullPolicy: Always
    # How long Kubernetes waits for a terminating runner pod to finish before
    # sending SIGKILL. 43200s (12h) is not an arbitrary safety margin — it is
    # matched to the runner's own agent.shutdown.timeout, which is what lets a
    # pod refuse to die until its in-flight pipeline tasks have completed.
    #
    # Lowering this converts a lossless planned failover into a lossy one. A node
    # drain, cluster upgrade or rolling update will then SIGKILL runners
    # mid-task, and the tasks they were running fail rather than draining. If a
    # long drain is unacceptable operationally, the fix is to stop *scheduling*
    # long tasks onto pods you intend to retire, not to shorten this.
    #
    # Two things silently defeat it regardless of what is set here:
    #   * `kubectl drain --grace-period=N` overrides the pod's value outright.
    #   * A liveness probe that trips during the drain kills the pod early. The
    #     probe defaults below are deliberately set beyond this window.
    gracePeriodSeconds: 43200
    # Optional override. Leave empty to derive from runnerSize. Setting any keys here
    # replaces the runnerSize-derived resources whole — set both requests and limits.
    resources: {}
  replicas: 2

# Shared Script Runner (opt-in). When enabled, deploys a separate runner pod the
# runner SSHes into for Script Pushdown (bash / python). Disabled by default —
# zero new resources rendered. See DPC-47328 / design §5.2.
scriptRunner:
  enabled: false
  # T-shirt size — reuses the runnerSizes map above (small/medium/large/xlarge).
  size: small
  replicas: 1
  image:
    # Production registries (set repository to match your cloud/region):
    #   AWS:              public.ecr.aws/matillion/maia-script-runner
    #   Azure:            matillion.azurecr.io/maia-script-runner
    #   GCP (australia):  australia-southeast1-docker.pkg.dev/maia-492711/maia-script-runner/maia-script-runner
    #   GCP (europe):     europe-docker.pkg.dev/maia-492711/maia-script-runner/maia-script-runner
    #   GCP (us):         us-docker.pkg.dev/maia-492711/maia-script-runner/maia-script-runner
    repository: <ScriptRunnerImageRepository>
    tag: latest
    # digest: <ScriptRunnerImageDigest>  # Optional: immutable deploys
    pullPolicy: Always
  # Customer-supplied SSH keypair (no template-side keygen). Provide via --set-file:
  #   --set-file scriptRunner.authorizedKeys=./runner_authorized_keys.pub
  #   --set-file scriptRunner.privateKey=./agent_runner_key
  # authorizedKeys: the public key(s) the script runner trusts (the Maia runner's public key).
  # privateKey:     the Maia runner's private key used to connect to the script runner.
  authorizedKeys: ""
  privateKey: ""
  # Optional resources override. Leave empty to derive from scriptRunner.size.
  resources: {}
  # Cap on the runner's /tmp scratch volume (emptyDir.sizeLimit). Bounds the
  # disk-fill blast radius to the pod — a runaway script is evicted rather than
  # exhausting node ephemeral storage. Raise if scripts stage large files.
  tmpSizeLimit: 5Gi
  # Script runner's own runtime identity (separate from the Maia runner's). One per cloud:
  serviceAccount:
    # Defaults to "<release>-script-runner-sa". Set both this and create=false to
    # bind to a platform-managed account, as per serviceAccount.create above.
    name: ""
    create: true
    roleArn: ""              # AWS IRSA role ARN. Required when serviceAccount.credentialSource is irsa.
    clientId: ""             # Azure workload-identity client ID
    serviceAccountEmail: ""  # GCP workload-identity SA email
  # Extra volumes, mounts and init containers on the script runner pod. Same
  # contract as the top-level extraVolumes / extraVolumeMounts / initContainers.
  # This is the more likely home for a Python-library init container: Script
  # Pushdown gets its own pod, so a large library set costs startup time here
  # without delaying the runner that schedules pipelines.
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []

# Health probes for the runner container. Both are opt-in and disabled by
# default, so the rendered Deployment is unchanged unless you turn them on.
#
# `path` defaults to /actuator/health, which the runner exposes (its management
# endpoints are info, health and prometheus). Builds running Spring Boot's
# Kubernetes probe groups can use the more precise /actuator/health/readiness
# and /actuator/health/liveness instead.
readinessProbe:
  enabled: false
  path: /actuator/health
  port: 8080
  # A runner registers with the control plane before it will accept work, and on
  # a cold start that takes a while. Set these too tight and a rolling update
  # looks hung rather than failing: the new pod never reports Ready, the rollout
  # stalls at the first replica, and the change that actually works gets rolled
  # back. 60s + 6 x 10s allows two minutes to come up.
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

livenessProbe:
  enabled: false
  path: /actuator/health
  port: 8080
  # Far more forgiving than readiness, on purpose. Readiness failing takes a pod
  # out of service and is recoverable; liveness failing destroys whatever the
  # runner was in the middle of. A runner executing 20 concurrent tasks can be
  # slow to answer without being broken, and restarting it there loses real work
  # rather than recovering anything.
  #
  # periodSeconds x failureThreshold (30 x 1500 = 12.5h) is deliberately longer
  # than the 43200s termination grace period, so a pod that is legitimately
  # draining in-flight tasks can never be killed by this probe before it
  # finishes. Keep that relationship if you change either number — the NOTES
  # output warns when it is broken.
  #
  # The trade-off is explicit: this window makes the probe a backstop against a
  # permanently wedged JVM rather than a fast recovery mechanism. Tighten it only
  # for deployments that do not run long tasks, and lower gracePeriodSeconds to
  # match if you do.
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 1500
  successThreshold: 1

kubernetesClusterDomain: cluster.local
hpa:
  enabled: true
  # Which runner metrics the HPA scales on. Needs the matching prometheus chart
  # (0.4.0 or later), whose adapter serves both sets side by side.
  #   legacy - app_active_task_count / app_active_request_count, scraped from
  #            the deprecated /actuator/prometheus endpoint. The default until
  #            the cutover date is set.
  #   otel   - matillion_agent_task_running / matillion_agent_request_active,
  #            scraped from the OpenTelemetry endpoint (metrics.otel).
  # Both report the same in-flight counts, so the target below needs no change
  # when switching.
  metricSource: legacy
  scaleDown:
    selectPolicy: Min
    stabilizationWindowSeconds: 180
    policies:
      - periodSeconds: 60
        type: Pods
        value: 1
  scaleUp:
    selectPolicy: Max
    stabilizationWindowSeconds: 0
    policies:
      - periodSeconds: 30
        type: Pods
        value: 1
  maxReplicas: <MaxReplicas>
  minReplicas: 2
  metrics:
    target:
      # Target in-flight tasks per runner pod. Each runner instance can run a
      # maximum of 20 concurrent tasks, so this value must not exceed 20.
      # Recommended range: 15-17 (15 = more proactive scaling for spiky
      # workloads, 17 = more reactive scaling for steadier workloads).
      averageValue: <ScaleUpAverageValue>
      type: AverageValue

# GCP-specific configuration
gcp:
  workloadIdentity:
    enabled: true   # Set to true to use GKE Workload Identity (recommended)
    # Get this value from Terraform output: runner_workload_sa_email
    serviceAccountEmail: ""  # e.g. my-sa@my-project.iam.gserviceaccount.com
  # The one sanctioned way to install on GCP without Workload Identity: the pod
  # inherits the GKE node pool's service account from the metadata server. Only
  # works on a node pool with the GKE metadata server disabled, and gives every
  # pod on the node the same identity — so it is an explicit choice, not a
  # default. With both this and workloadIdentity off, rendering fails rather
  # than producing a runner with no identity at all (DPC-55764).
  nodeIdentity:
    enabled: false

# AWS-specific configuration for local deployments
aws:
  # AWS region for the agent and the script runner, on every credential source.
  #
  # Set this if scripts or components rely on the environment for their region.
  # Nothing in the cluster provides one: IRSA and the node profile deliver
  # credentials but not a region, and the AWS SDKs keep the two separate, so a
  # pod can hold valid credentials and still fail at client construction with
  # NoRegionError. Script Pushdown is the common case — the runner forwards
  # AWS_REGION/AWS_DEFAULT_REGION into every SSH session, so a script that does
  # not set a region itself has nothing to fall back on.
  #
  # Left empty no region variables are rendered at all, which is the behaviour
  # before this existed. Falls back to aws.local.region when that is set, so
  # static-credential callers do not have to state the region twice.
  region: ""
  local:
    # Equivalent to serviceAccount.credentialSource=static, and kept working for
    # releases that already set it. Setting this alongside a credentialSource of
    # anything other than "static" is rejected rather than silently resolved.
    #
    # Prefer credentialSource=node over static keys where the cluster's nodes
    # carry an instance profile — it is the same reachability with no long-lived
    # secret to rotate or leak.
    enabled: false  # Set to true to use direct AWS credentials instead of role-based authentication
    region: ""      # AWS Region (required when local.enabled is true)
    accessKeyId: "" # AWS Access Key ID (required when local.enabled is true)
    secretAccessKey: "" # AWS Secret Access Key (required when local.enabled is true)

# Azure-specific configuration
azure:
  # Subscription the agent should use for Azure Resource Manager lookups —
  # Key Vault and storage-account listing. Optional, but pin it on any tenant
  # with more than one subscription: left empty the agent uses whichever
  # subscription ARM returns first, which is not stable and can leave the Key
  # Vault picker empty (DPCT-2352). Get it with: az account show --query id -o tsv
  subscriptionId: ""
  workloadIdentity:
    enabled: true   # Set to true to use Azure Workload Identity (requires AKS with OIDC issuer)
    clientId: ""    # Azure Workload Identity Client ID (User Assigned Managed Identity)
    tokenExpiration: 3600  # Service account token expiration in seconds (3600-86400, default: 3600)
  servicePrincipal:
    enabled: false  # Set to true to use Service Principal instead of Workload Identity
    clientId: ""    # Azure Service Principal Client ID
    clientSecret: "" # Azure Service Principal Client Secret
    tenantId: ""    # Azure Tenant ID
  # Azure's equivalent of gcp.nodeIdentity: the pod inherits the AKS node pool's
  # kubelet managed identity over IMDS. Same trade-off — node-wide rather than
  # per-workload — and the same rule: with workloadIdentity, servicePrincipal
  # and this all off, rendering fails instead of installing a runner that has no
  # Azure identity (DPC-55764).
  nodeIdentity:
    enabled: false

# Runner metrics endpoints. The runner serves two while customers migrate
# (DPC-58189):
#   legacy - Micrometer, /actuator/prometheus on 8080, app_* names. Deprecated;
#            kept until product sets the cutover date.
#   otel   - the OpenTelemetry Java agent's Prometheus exporter, /metrics on
#            9464, matillion_agent_* names plus JVM and process metrics. Needs a
#            runner image with the exporter (cloud-agent-service DPC-55707).
#
# `enabled` controls whether the chart exposes an endpoint: its container port,
# the NetworkPolicy ingress rule from the Prometheus namespace, and whether it
# can be advertised in the scrape annotations. It does not switch the endpoint
# off inside the runner. Port 8080 also serves the health probes, so it stays
# declared regardless.
metrics:
  legacy:
    enabled: true
    port: 8080
    path: /actuator/prometheus
  otel:
    enabled: true
    # Passed to the runner as OTEL_EXPORTER_PROMETHEUS_PORT, so the port the
    # exporter binds and the port the chart opens cannot drift apart.
    port: 9464
    path: /metrics
  # Which endpoint the prometheus.io/* pod annotations advertise. They can
  # describe only one, so an annotation-driven scraper sees only this one; to
  # scrape both, add an explicit scrape job for the other (the prometheus chart
  # does). Stays `legacy` until cutover so existing scrapers aren't silently
  # moved onto different metric names.
  annotationTarget: legacy

# Network security configuration
networkPolicy:
  enabled: true
  prometheusNamespace: monitoring
  allowHttp: true
  additionalEgressRules: []

# Pod security configuration
podSecurityContext:
  # Additional kernel sysctls to set on the pod (advanced use).
  sysctls: []
  # Network Environment Configuration (optional)
  # Enable OS-level TCP keepalive on the runner pod. Recommended when connecting
  # to NetSuite (or other sources that drop idle, long-running connections).
  # Opt-in: disabled by default so the pod's default behaviour is unchanged.
  tcpKeepAlive:
    enabled: false
    keepaliveTime: 90
    keepaliveInterval: 15
    keepaliveProbes: 5

# Labels added to every resource this chart creates, and to the runner pods.
# Intended for tenant attribution on a shared cluster — business unit, cost
# centre, owning team — so one platform can be queried and billed per tenant
# without the chart knowing anything about tenants.
#
# Additive only. `app`, `app.kubernetes.io/name` and `app.kubernetes.io/instance`
# are rejected: they form the Deployment's spec.selector, which Kubernetes treats
# as immutable, so overriding one makes `helm upgrade` of an existing release
# fail outright rather than roll.
#
# Example:
#   commonLabels:
#     matillion.com/business-unit: grid
#     matillion.com/cost-centre: "4471"
commonLabels: {}

# Extra annotations on the runner pods. Merged with the prometheus.io/* scrape
# annotations the chart already sets.
podAnnotations: {}

# Extra volumes, mounts and init containers on the runner pod, passed through to
# the pod spec verbatim. All empty by default, so the rendered Deployment is
# unchanged unless you set them. See scriptRunner.* for the equivalents on the
# Script Pushdown runner — the two hydrate independently.
#
# The main use is supplying third-party Python libraries from an image you build
# and control, instead of staging them in object storage and pointing
# EXTENSION_LIBRARY_LOCATION at the bucket. The runner image treats
# /usr/lib/pythonLibs as a runtime-populated directory that is already on the
# interpreter's import path, so an init container that copies wheels into a
# shared emptyDir mounted there needs no application-side change. Worked example
# in runner/helm/README.md.
#
# Nothing validates these beyond the API server: a mount over a path the runner
# needs (/tmp, /etc/config) will break it, and an init container that never
# exits 0 blocks the pod from starting at all.
extraVolumes: []
extraVolumeMounts: []
initContainers: []

# Node selector configuration
# Optional: specify node labels to schedule pods on specific nodes
# Example:
#   nodeSelector:
#     kubernetes.io/os: linux
#     node.kubernetes.io/instance-type: m5.large
nodeSelector: {}

# Optional pod affinity / anti-affinity, passed through to the pod spec verbatim.
# Absent by default, so the rendered Deployment is unchanged unless you set it.
affinity: {}

# Spread runner replicas across availability zones. Opt-in — with this disabled
# the rendered Deployment is identical to earlier chart versions.
#
# Zone spread only does anything if the nodes themselves span zones. On EKS the
# node group already spans the AZs of its subnets, and GKE clusters here are
# regional, so both are ready as-is. On AKS the node pool must be created with
# `node_pool_zones` set (modules/azure/aks) — without it every node, and so every
# replica, lands in one zone.
topologySpread:
  enabled: false
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  # ScheduleAnyway is deliberate and should not be changed to DoNotSchedule
  # without checking the cluster spans zones: DoNotSchedule leaves pods Pending
  # forever on a single-zone cluster rather than degrading to an uneven spread.
  whenUnsatisfiable: ScheduleAnyway

# Voluntary-disruption budget for the runner pods. Off by default.
#
# A PDB is only rendered when the workload's replica floor is at least 2 (that
# floor is hpa.minReplicas when the HPA is enabled, otherwise dpcAgent.replicas).
# A budget over a single-replica workload permits *zero* voluntary evictions, so
# `kubectl drain` and cluster upgrades hang indefinitely instead of proceeding —
# enabling it in that configuration is a template error rather than a silent
# no-op. maxUnavailable is used rather than minAvailable for the same reason: it
# cannot reach the zero-eviction state as the workload scales.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
# Queue → Maia Foundations pipeline-trigger adapter (Azure AKS path).
# Disabled by default — zero resources rendered. Deploys the maia-queue-adapter
# image as a KEDA ScaledJob triggered by Azure Service Bus queue depth. Requires
# the cluster's KEDA addon and Workload Identity addon to be enabled.
queueAdapter:
  enabled: false
  # Which Azure queue to consume: "servicebus" (ordering/dedup/DLQ parity) or
  # "storage" (Azure Queue Storage, lighter/METL-parity).
  backend: servicebus
  image:
    # Azure: <registry>.azurecr.io/maia-queue-adapter-azure
    repository: <QueueAdapterImageRepository>
    tag: current
    # digest: <QueueAdapterImageDigest>  # Optional: immutable deploys
    pullPolicy: Always
  # Workload-identity client ID of the managed identity the adapter runs as. It
  # needs Key Vault Secrets User on the vault, Storage Table Data Reader on the
  # mapping table, and for the queue:
  #   backend: servicebus -> Azure Service Bus Data Receiver on the queue
  #   backend: storage    -> Storage Queue Data Contributor on the source queue
  #                          AND on <queueName>-poison
  # Storage Queue Data Message Processor is not enough on the storage backend:
  # it cannot re-hide a message for a retry backoff, nor create and write the
  # poison queue the adapter dead-letters to, so failures redeliver until TTL.
  #
  # The identity also needs a second federated credential, for the KEDA operator's
  # service account (kube-system/keda-operator on the AKS addon). The
  # TriggerAuthentication below uses podIdentity azure-workload, so it is KEDA —
  # not the adapter pod — that assumes this identity to read queue depth. Without
  # it the ScaledJob reports Ready and no job is ever started: messages just
  # accumulate.
  serviceAccount:
    clientId: ""
  # Service Bus source queue (backend: servicebus).
  serviceBus:
    namespace: ""    # <ns>.servicebus.windows.net (fully-qualified)
    queueName: matillion-maia-requests
  # Key Vault holding {client_id, client_secret} for Maia Foundations OAuth.
  keyVault:
    url: ""          # https://<vault>.vault.azure.net/
    secretName: matillion-maia
  # Storage: project-mapping table always; source queue when backend: storage.
  storage:
    accountName: ""  # storage account short name (KEDA azure-queue scaler)
    accountUrl: ""   # https://<acct>.table.core.windows.net (Table endpoint)
    queueUrl: ""     # https://<acct>.queue.core.windows.net (Queue endpoint, backend: storage)
    tableName: matillionprojectmappings
    queueName: matillion-maia-requests
  matillionApiUrl: "https://eu1.api.matillion.com/dpc/v1"
  matillionTokenUrl: "https://id.core.matillion.com/oauth/dpc/token"
  # KEDA scaling.
  scaling:
    minReplicaCount: 0
    maxReplicaCount: 10
    pollingInterval: 30       # seconds
    messagesPerExecution: 5   # KEDA messageCount (servicebus)
    queueLength: 5            # KEDA queueLength (storage)
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
