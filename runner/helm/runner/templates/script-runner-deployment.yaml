---
{{- if .Values.scriptRunner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matillion-runner.scriptRunner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "matillion-runner.scriptRunner.fullname" . }}-pods
{{- include "matillion-runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scriptRunner.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ include "matillion-runner.scriptRunner.fullname" . }}-pods
{{- include "matillion-runner.scriptRunner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ include "matillion-runner.scriptRunner.fullname" . }}-pods
{{- include "matillion-runner.scriptRunner.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- include "matillion-runner.commonLabels" $ | nindent 8 }}
        {{- end }}
        {{- if and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- if and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled }}
      annotations:
        azure.workload.identity/service-account-token-expiration: {{ quote .Values.azure.workloadIdentity.tokenExpiration }}
        azure.workload.identity/inject-proxy-sidecar: "true"
      {{- end }}
    spec:
      serviceAccountName: {{ include "matillion-runner.scriptRunner.serviceAccountName" . }}
      {{- if or (and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled) (and (eq (include "matillion-runner.cloudProvider" .) "gcp") .Values.gcp.workloadIdentity.enabled) }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scriptRunner.initContainers }}
      # Separate from the runner's .Values.initContainers on purpose: the two
      # workloads hydrate independently, and Script Pushdown is where the heavier
      # library sets tend to land.
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ include "matillion-runner.scriptRunner.fullname" . }}-pods
        image: {{ .Values.scriptRunner.image.repository }}{{ if .Values.scriptRunner.image.digest }}@{{ .Values.scriptRunner.image.digest }}{{ else }}:{{ .Values.scriptRunner.image.tag | default "latest" }}{{ end }}
        imagePullPolicy: {{ .Values.scriptRunner.image.pullPolicy | default "Always" }}
        # The runner image listens on the non-privileged port 2222 and runs end-
        # to-end as the unprivileged mtln user (host keys, /run/sshd, and
        # /home/mtln/.ssh are pre-baked at build time). That lets us enforce
        # runAsNonRoot here and still keep allowPrivilegeEscalation off — a
        # setuid binary inside the runner can't escape mtln's privileges in
        # spawned shells. capabilities.drop: [ALL] is defence-in-depth — a
        # non-root container doesn't have most caps anyway, but dropping ALL
        # explicitly means a future image change (e.g. an `apt-get install` of
        # a setcap binary) can't reintroduce one without a chart-level grant.
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 2222
          name: ssh
        # Restart the pod if sshd stops accepting connections. Destructive-test
        # H8 (DPC-49795) showed a runner can end up in a broken state with sshd
        # dead but the container still "running" (RESTARTS: 0) — without a probe
        # Kubernetes never self-heals and an operator has to delete the pod by
        # hand. A TCP check on the listen port catches a dead/wedged sshd.
        livenessProbe:
          tcpSocket:
            port: ssh
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        {{- if and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled }}
        lifecycle:
          postStart:
            exec:
              # Unsetting the token file moves az off native federation (which caches a
              # one-time assertion and goes stale after ~1h) onto ManagedIdentityCredential.
              # proxy-init's iptables REDIRECT sends the IMDS call to the sidecar, so no
              # endpoint override is needed. Guard is on the credential type rather than
              # just a session, matching the agent deployment - this image has no
              # entrypoint login of its own, but the check must not accept one if it
              # gains one. Retries because the hook can outrace the proxy.
              command: ["/bin/sh", "-c", "timeout 90 sh -c 'L=/proc/1/fd/1; : >>$L 2>/dev/null || L=/dev/null; for i in 1 2 3; do az account show --query user.assignedIdentityInfo -o tsv 2>/dev/null | grep -q MSI && exit 0; env -u AZURE_FEDERATED_TOKEN_FILE az login --identity --allow-no-subscriptions >>$L 2>&1 && exit 0; sleep 5; done; exit 1'"]
        {{- end }}
        env:
        - name: CLOUD_PROVIDER
          value: {{ include "matillion-runner.cloudProvider" . | upper | quote }}
        # Tell the runner image where to read authorized_keys from. Must match the
        # volumeMount path below. We deliberately keep this off /run/secrets so the
        # projected service-account token mounts (AWS IRSA / Azure WI) can be created.
        - name: RUNNER_AUTHORIZED_KEYS_FILE
          value: /etc/matillion/runner-keys/runner_authorized_keys
        - name: EXTENSION_LIBRARY_LOCATION
          value: {{ quote .Values.dpcAgent.dpcAgent.env.extensionLibraryLocation }}
        {{- if and (eq (include "matillion-runner.cloudProvider" .) "aws") (include "matillion-runner.aws.region" .) }}
        # Script Pushdown scripts are the main consumer of these. The runner's
        # entry point forwards both names into every SSH session through
        # ~/.ssh/environment, so a script that does not set a region itself has
        # nothing to fall back on and fails building its first boto3 client. Set
        # on every credential source, not just static — IRSA hands over
        # credentials but never a region. (DPC-55696)
        - name: AWS_REGION
          value: {{ include "matillion-runner.aws.region" . | quote }}
        - name: AWS_DEFAULT_REGION
          value: {{ include "matillion-runner.aws.region" . | quote }}
        {{- end }}
        {{- if .Values.dpcAgent.dpcAgent.env.customCertLocation }}
        - name: CUSTOM_CERT_LOCATION
          value: {{ quote .Values.dpcAgent.dpcAgent.env.customCertLocation }}
        {{- end }}
        # Azure Workload Identity needs the client id for the runner's own
        # managed-identity login during library/cert hydration (AWS IRSA and GCP
        # WI are tokenless — the projected SA token is enough).
        {{- if and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled }}
        - name: AZURE_CLIENT_ID
          value: {{ required "scriptRunner.serviceAccount.clientId is required for Azure workload identity deployments" .Values.scriptRunner.serviceAccount.clientId }}
        {{- end }}
        resources:
          {{- include "matillion-runner.scriptRunner.resources" . | nindent 10 }}
        volumeMounts:
        - name: runner-keys
          # Mount the authorized_keys secret under a dedicated path, NOT /run/secrets.
          # /var/run/secrets is a symlink to /run/secrets, which is exactly where
          # Kubernetes injects projected service-account tokens: AWS IRSA at
          # /var/run/secrets/eks.amazonaws.com/serviceaccount and Azure Workload
          # Identity at /var/run/secrets/azure/tokens. Overlaying /run/secrets with a
          # read-only secret volume stops the container runtime from creating those
          # token mountpoints, so the pod crash-loops with "read-only file system"
          # (DPC-50587). Keeping the keys on a separate path leaves /run/secrets
          # writable for the platform. The image reads RUNNER_AUTHORIZED_KEYS_FILE.
          mountPath: /etc/matillion/runner-keys
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
        {{- with .Values.scriptRunner.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      # Project only the public authorized_keys into the runner — never the
      # runner's private key.
      - name: runner-keys
        secret:
          secretName: {{ include "matillion-runner.scriptRunner.fullname" . }}-keys
          items:
          - key: runner_authorized_keys
            path: runner_authorized_keys
      - name: tmp-volume
        emptyDir:
          # Bound the runner's scratch space so a runaway script can't exhaust
          # node ephemeral storage (destructive-test H2 / DPC-49794). When the
          # limit is hit Kubernetes evicts this pod, not the node — keeping the
          # blast radius pod-local. Tunable via scriptRunner.tmpSizeLimit.
          sizeLimit: {{ .Values.scriptRunner.tmpSizeLimit | quote }}
      {{- with .Values.scriptRunner.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
