---
{{- if .Values.queueAdapter.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "matillion-runner.fullname" . }}-queue-adapter-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if eq (include "matillion-runner.cloudProvider" .) "aws" }}
    # IRSA: the adapter's own role, not the runner's — it needs SQS, Secrets
    # Manager and DynamoDB, none of which the runner should hold.
    eks.amazonaws.com/role-arn: {{ required "queueAdapter.aws.roleArn is required when queueAdapter.enabled on AWS" .Values.queueAdapter.aws.roleArn | quote }}
    {{- else }}
    azure.workload.identity/client-id: {{ required "queueAdapter.serviceAccount.clientId is required when queueAdapter.enabled" .Values.queueAdapter.serviceAccount.clientId }}
    {{- end }}
  labels:
{{- include "matillion-runner.labels" . | nindent 4 }}
    {{- if ne (include "matillion-runner.cloudProvider" .) "aws" }}
    azure.workload.identity/use: "true"
    {{- end }}
{{- end }}
