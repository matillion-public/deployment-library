apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matillion-runner.fullname" . }}-app
  labels:
    app: {{ include "matillion-runner.fullname" . }}-pods
  {{- include "matillion-runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dpcAgent.replicas }}
  selector:
    matchLabels:
      app: {{ include "matillion-runner.fullname" . }}-pods
    {{- include "matillion-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ include "matillion-runner.fullname" . }}-pods
      {{- include "matillion-runner.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- include "matillion-runner.commonLabels" $ | nindent 8 }}
        {{- end }}
        {{- if and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled }}
        azure.workload.identity/service-account-token-expiration: {{ quote .Values.azure.workloadIdentity.tokenExpiration }}
        azure.workload.identity/inject-proxy-sidecar: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "matillion-runner.serviceAccountName" . }}
      {{- if or (and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled) (and (eq (include "matillion-runner.cloudProvider" .) "gcp") .Values.gcp.workloadIdentity.enabled) }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- if or (gt (len .Values.podSecurityContext.sysctls) 0) .Values.podSecurityContext.tcpKeepAlive.enabled }}
      securityContext:
        sysctls:
        {{- with .Values.podSecurityContext.sysctls }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.podSecurityContext.tcpKeepAlive.enabled }}
        - name: "net.ipv4.tcp_keepalive_time"
          value: {{ .Values.podSecurityContext.tcpKeepAlive.keepaliveTime | quote }}
        - name: "net.ipv4.tcp_keepalive_intvl"
          value: {{ .Values.podSecurityContext.tcpKeepAlive.keepaliveInterval | quote }}
        - name: "net.ipv4.tcp_keepalive_probes"
          value: {{ .Values.podSecurityContext.tcpKeepAlive.keepaliveProbes | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ include "matillion-runner.fullname" . }}-pods
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.dpcAgent.dpcAgent.gracePeriodSeconds }}
      {{- with .Values.initContainers }}
      # Caller-supplied init containers. The runner's own startup does not depend
      # on any of these, so anything here is additive — but the pod does not start
      # until they all exit 0, so a failing one is a hard outage, not a degraded
      # runner. The intended use is populating a shared emptyDir declared in
      # extraVolumes; see runner/helm/README.md for the Python-library pattern.
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - envFrom:
        - secretRef:
            name: {{ include "matillion-runner.fullname" . }}-config
        env:
        {{- if .Values.dpcAgent.dpcAgent.env.direct }}
        {{- range .Values.dpcAgent.dpcAgent.env.direct }}
        - name: {{ .name }}
          value: {{ quote .value }}
        {{- end }}
        {{- else }}
        - name: ACCOUNT_ID
          value: {{ quote .Values.dpcAgent.dpcAgent.env.accountId }}
        - name: AGENT_ID
          value: {{ quote .Values.dpcAgent.dpcAgent.env.agentId }}
        - name: MATILLION_REGION
          value: {{ quote .Values.dpcAgent.dpcAgent.env.matillionRegion }}
        - name: CLOUD_PROVIDER
          value: {{ include "matillion-runner.cloudProvider" . | upper | quote }}
        - name: PROXY_HTTP
          value: {{ quote .Values.dpcAgent.dpcAgent.env.proxyHttp }}
        - name: PROXY_HTTPS
          value: {{ quote .Values.dpcAgent.dpcAgent.env.proxyHttps }}
        - name: PROXY_EXCLUDE
          value: {{ quote .Values.dpcAgent.dpcAgent.env.proxyExclude }}
        - name: PROXY_PROTOCOL_HTTP
          value: {{ quote .Values.dpcAgent.dpcAgent.env.proxyProtocolHttp }}
        - name: PROXY_PROTOCOL_HTTPS
          value: {{ quote .Values.dpcAgent.dpcAgent.env.proxyProtocolHttps }}
        - name: CUSTOM_CERT_LOCATION
          value: {{ quote .Values.dpcAgent.dpcAgent.env.customCertLocation }}
        - name: EXTENSION_LIBRARY_LOCATION
          value: {{ quote .Values.dpcAgent.dpcAgent.env.extensionLibraryLocation }}
        - name: EXTERNAL_DRIVER_LOCATION
          value: {{ quote .Values.dpcAgent.dpcAgent.env.externalDriverLocation }}
        - name: EXPORT_LOGS
          value: {{ quote .Values.dpcAgent.dpcAgent.env.exportLogs }}
        {{- if .Values.dpcAgent.dpcAgent.env.matillionEnv }}
        - name: MATILLION_ENV
          value: {{ quote .Values.dpcAgent.dpcAgent.env.matillionEnv }}
        {{- end }}
        {{- end }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        {{- if .Values.scriptRunner.enabled }}
        # Hostname the runner SSHes into for Script Pushdown — the short ClusterIP
        # Service name, which resolves within the release's namespace (kube-dns
        # appends the namespace + cluster suffix at lookup time). Cross-namespace
        # callers would need to use the fully qualified <name>.<ns>.svc.<domain>.
        - name: MTLN_SCRIPT_RUNNER_HOST
          value: {{ include "matillion-runner.scriptRunner.fullname" . | quote }}
        {{- end }}
        {{- if .Values.dpcAgent.dpcAgent.env.fromSecret }}
        {{- range .Values.dpcAgent.dpcAgent.env.fromSecret }}
        - name: {{ .name }}
          valueFrom:
            secretKeyRef:
              name: {{ .secretName }}
              key: {{ .secretKey }}
        {{- end }}
        {{- else }}
        {{- if eq (include "matillion-runner.cloudProvider" .) "aws" }}
        {{- if eq (include "matillion-runner.aws.credentialSource" .) "static" }}
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: {{ include "matillion-runner.fullname" . }}-aws-local
              key: aws-region
        # Both names, because the two AWS SDKs disagree about which one they
        # read: botocore honours either, but several older clients and the CLI's
        # own config resolution only look at AWS_DEFAULT_REGION.
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: {{ include "matillion-runner.fullname" . }}-aws-local
              key: aws-region
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "matillion-runner.fullname" . }}-aws-local
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "matillion-runner.fullname" . }}-aws-local
              key: aws-secret-access-key
        {{- else if include "matillion-runner.aws.region" . }}
        # IRSA and the node profile hand over credentials but never a region, so
        # without this the pod authenticates fine and then fails building its
        # first client. Values-supplied because nothing in the cluster knows it.
        - name: AWS_REGION
          value: {{ include "matillion-runner.aws.region" . | quote }}
        - name: AWS_DEFAULT_REGION
          value: {{ include "matillion-runner.aws.region" . | quote }}
        {{- end }}
        {{- end }}
        {{- if eq (include "matillion-runner.cloudProvider" .) "azure" }}
        - name: DEFAULT_KEYVAULT
          value: {{ quote .Values.dpcAgent.dpcAgent.env.defaultKeyvault }}
        {{- if .Values.azure.subscriptionId }}
        # AZURE_DEFAULT_SUBSCRIPTION_ID is the name the agent actually binds
        # (agent.azure.subscription.id in cloud-component-runner's
        # application-blob-storage.yaml). Without it the agent falls back to the
        # first subscription ARM happens to return, which is non-deterministic in
        # multi-subscription tenants and empties the Key Vault picker (DPCT-2352).
        - name: AZURE_DEFAULT_SUBSCRIPTION_ID
          value: {{ quote .Values.azure.subscriptionId }}
        # Retained for backwards compatibility: the agent has never read this
        # name, but user scripts running in the container may.
        - name: AZURE_SUBSCRIPTION_ID
          value: {{ quote .Values.azure.subscriptionId }}
        {{- end }}
        {{- if .Values.azure.workloadIdentity.enabled }}
        - name: AZURE_CLIENT_ID
          value: {{ required "azure.workloadIdentity.clientId is required for Azure workload identity deployments" .Values.azure.workloadIdentity.clientId }}
        {{- else if .Values.azure.servicePrincipal.enabled }}
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "matillion-runner.fullname" . }}-azure-sp
              key: client-id
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "matillion-runner.fullname" . }}-azure-sp
              key: client-secret
        - name: AZURE_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "matillion-runner.fullname" . }}-azure-sp
              key: tenant-id
        {{- end }}
        {{- end }}
        {{- if and (eq (include "matillion-runner.cloudProvider" .) "gcp") .Values.dpcAgent.dpcAgent.env.defaultGcpProject }}
        - name: DEFAULT_GCP_PROJECT
          value: {{ quote .Values.dpcAgent.dpcAgent.env.defaultGcpProject }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
        - name: api-profiles-volume
          mountPath: /home/agentuser/api_profiles
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        image: {{ .Values.dpcAgent.dpcAgent.image.repository }}{{ if .Values.dpcAgent.dpcAgent.image.digest }}@{{ .Values.dpcAgent.dpcAgent.image.digest }}{{ else }}:{{ .Values.applicationImageTag | default .Values.dpcAgent.dpcAgent.image.tag | default .Chart.AppVersion }}{{ end }}
        imagePullPolicy: {{ .Values.dpcAgent.dpcAgent.imagePullPolicy | default "Always" }}
        name: {{ include "matillion-runner.fullname" . }}-pods
        ports:
        - containerPort: 8080
          name: metrics
        securityContext: {}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.readinessProbe.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            port: {{ .Values.livenessProbe.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
        {{- end }}
        {{- if and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled }}
        lifecycle:
          postStart:
            exec:
              # Unsetting the token file moves az off native federation (which caches a
              # one-time assertion and goes stale after ~1h) onto ManagedIdentityCredential.
              # proxy-init's iptables REDIRECT sends the IMDS call to the sidecar, so no
              # endpoint override is needed. Guard is on the credential type, not just a
              # session: the entrypoint does its own native-federation login and could
              # otherwise be deferred to. Retries because the hook can outrace the proxy.
              command: ["/bin/sh", "-c", "timeout 90 sh -c 'L=/proc/1/fd/1; : >>$L 2>/dev/null || L=/dev/null; for i in 1 2 3; do az account show --query user.assignedIdentityInfo -o tsv 2>/dev/null | grep -q MSI && exit 0; env -u AZURE_FEDERATED_TOKEN_FILE az login --identity --allow-no-subscriptions >>$L 2>&1 && exit 0; sleep 5; done; exit 1'"]
        {{- end }}
        resources:
          {{- include "matillion-runner.resources" . | nindent 10 }}
      volumes:
      - name: config-volume
        secret:
          secretName: {{ include "matillion-runner.fullname" . }}-config
      - name: tmp-volume
        emptyDir: {}
      - name: api-profiles-volume
        emptyDir: {}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}