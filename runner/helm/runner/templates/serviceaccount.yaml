{{- include "matillion-runner.validateCloudIdentity" . -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "matillion-runner.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- if eq (include "matillion-runner.cloudProvider" .) "aws" }}
  {{- if eq (include "matillion-runner.aws.credentialSource" .) "irsa" }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required when serviceAccount.credentialSource is irsa (the default). For a cluster that assigns AWS permissions per node rather than per service account, set serviceAccount.credentialSource=node instead — leaving roleArn empty is not a way to select the node instance profile." .Values.serviceAccount.roleArn }}
  {{- end }}
  {{- else if eq (include "matillion-runner.cloudProvider" .) "azure" }}
  {{- if .Values.azure.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "azure.workloadIdentity.clientId is required for Azure workload identity deployments" .Values.azure.workloadIdentity.clientId }}
  {{- end }}
  {{- else if eq (include "matillion-runner.cloudProvider" .) "gcp" }}
  {{- if .Values.gcp.workloadIdentity.enabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "gcp.workloadIdentity.serviceAccountEmail is required for GCP workload identity deployments" .Values.gcp.workloadIdentity.serviceAccountEmail }}
  {{- end }}
  {{- end }}
  labels:
    {{- if and (eq (include "matillion-runner.cloudProvider" .) "azure") .Values.azure.workloadIdentity.enabled }}
    azure.workload.identity/use: "true"
    {{- end }}
    {{- if and (eq (include "matillion-runner.cloudProvider" .) "gcp") .Values.gcp.workloadIdentity.enabled }}
    app.kubernetes.io/gcp-workload-identity: "true"
    {{- end }}
{{- end }}
