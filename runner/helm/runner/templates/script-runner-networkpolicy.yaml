---
{{- if and .Values.scriptRunner.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "matillion-runner.scriptRunner.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "matillion-runner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "matillion-runner.scriptRunner.fullname" . }}-pods
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # SSH (and SFTP) on the runner's actual listen port (2222) — only from runner
  # pods. NetworkPolicy ingress rules apply at the pod level, so this is the
  # container's port, not the Service's port mapping.
  - from:
    - podSelector:
        matchLabels:
          app: {{ include "matillion-runner.fullname" . }}-pods
    ports:
    - protocol: TCP
      port: 2222
  {{- if .Values.scriptRunner.metrics.enabled }}
  # Prometheus scraping the session metric (DPC-55686) — the HPA's only signal,
  # so a blocked scrape means no scaling and no error. Peers are ORed:
  #   - the namespace by the `name` label the runner's own metrics rule uses,
  #   - the same namespace by kubernetes.io/metadata.name, which Kubernetes sets
  #     on every namespace (the docs install into one nobody labels),
  #   - a Prometheus in this release's own namespace.
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ .Values.networkPolicy.prometheusNamespace | default "monitoring" }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | default "monitoring" }}
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: {{ .Values.scriptRunner.metrics.port }}
  {{- end }}
  egress:
  # DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # HTTPS outbound — library / certificate hydration from cloud storage
  # (S3 / Azure Blob / GCS) and cloud-provider auth endpoints.
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Custom egress rules (shared with the runner's allow-list)
  {{- if .Values.networkPolicy.additionalEgressRules }}
  {{- toYaml .Values.networkPolicy.additionalEgressRules | nindent 2 }}
  {{- end }}
{{- end }}
