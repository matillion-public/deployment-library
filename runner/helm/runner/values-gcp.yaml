---
# GCP GKE Deployment Example
# This example shows configuration for deploying the runner on GKE using Workload Identity

cloudProvider: "gcp"

# Agent t-shirt size — small | medium | large | xlarge. See values.yaml for the size map.
# Recommended GKE node sizing: small/medium → e2-standard-2 or larger,
# large → e2-standard-8, xlarge → e2-standard-16. Always size the node above the
# request to leave room for kubelet/system pods.
runnerSize: small

config:
  oauthClientId: "your-oauth-client-id"
  oauthClientSecret: "your-oauth-client-secret"

# Service account names are pinned to the ones this repo's Terraform creates
# its workload-identity bindings for: matillion-runner-sa for the runner (the
# chart default) and matillion-runner-script-runner-sa for the script runner
# (pinned at the end of this file). An empty name falls back to a
# release-derived one, which only matches when the release is called
# matillion-runner; any other release then can't obtain cloud credentials and
# never becomes ready. Changing either name means changing the matching
# Terraform variable too.

dpcAgent:
  dpcAgent:
    env:
      accountId: "your-matillion-account-id"
      agentId: "your-matillion-agent-id"
      matillionRegion: "us1"  # Options: us1, eu1, au1
      defaultGcpProject: "your-gcp-project-id"
      proxyHttp: ""
      proxyHttps: ""
      proxyExclude: ""
      # proxyProtocolHttp: ""
      # proxyProtocolHttps: ""
      customCertLocation: ""
      extensionLibraryLocation: ""
      externalDriverLocation: ""
      exportLogs: "true"
    image:
      repository: "europe-docker.pkg.dev/maia-492711/maia-runners/maia-runner"
      tag: "current"
    imagePullPolicy: Always  # Required: 'current' is a rolling tag; Always ensures latest image is pulled
    gracePeriodSeconds: 43200
    # Resources derived from .Values.runnerSize. Set this map to override.
    resources: {}
  replicas: 2

kubernetesClusterDomain: cluster.local

hpa:
  enabled: true
  scaleDown:
    selectPolicy: Min
    stabilizationWindowSeconds: 180
    policies:
      - periodSeconds: 60
        type: Pods
        value: 1
  scaleUp:
    selectPolicy: Max
    stabilizationWindowSeconds: 0
    policies:
      - periodSeconds: 30
        type: Pods
        value: 1
  maxReplicas: 10
  minReplicas: 2
  metrics:
    target:
      averageValue: "16"
      type: AverageValue

# GCP-specific configuration
gcp:
  workloadIdentity:
    enabled: true
    # GCP Service Account email for Workload Identity
    # Get this value from Terraform output: runner_workload_sa_email
    #
    # No terraform output to hand? Do NOT reach for `enabled: false` — that
    # leaves the pod with no GCP identity at all, and the chart now refuses to
    # render it. Either bind an identity (runner/gcp/gke/README.md, "Binding an
    # identity to a runner already installed") or, if the pod is deliberately
    # taking the node pool's service account, set gcp.nodeIdentity.enabled=true
    # as well, so the choice is on the record.
    serviceAccountEmail: "your-runner-sa@your-project.iam.gserviceaccount.com"

# AWS configuration - disabled for GCP
aws:
  local:
    enabled: false

# Azure configuration - disabled for GCP
azure:
  workloadIdentity:
    enabled: false
  servicePrincipal:
    enabled: false

# Network security configuration
networkPolicy:
  enabled: true
  prometheusNamespace: monitoring
  allowHttp: true
  additionalEgressRules: []

# Pod security configuration
podSecurityContext:
  # Additional kernel sysctls to set on the pod (advanced use).
  sysctls: []
  # Network Environment Configuration (optional)
  # Enable OS-level TCP keepalive on the runner pod. Recommended when connecting
  # to NetSuite (or other sources that drop idle, long-running connections).
  # Opt-in: disabled by default so the pod's default behaviour is unchanged.
  tcpKeepAlive:
    enabled: false
    keepaliveTime: 90
    keepaliveInterval: 15
    keepaliveProbes: 5

# Node selector configuration
# Example: Schedule pods on specific node pools
nodeSelector: {}
#   cloud.google.com/gke-nodepool: default-pool

scriptRunner:
  serviceAccount:
    name: matillion-runner-script-runner-sa
